[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "myapp"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0",
    "pandas"
]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
# E/W = PEP 8, F = bugs, I = import order, B = common pitfalls,
# N = naming, UP = modern syntax
select = ["E", "W", "F", "I", "B", "N", "UP"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
[tool.ruff.lint.isort]
known-first-party = ["myapp"]
